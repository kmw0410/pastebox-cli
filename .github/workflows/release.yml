name: Release

on:
  workflow_run:
    workflows:
      - CLI Package Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: CLI Package Build run ID to use for package artifacts
        required: true
        type: string

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      contains(github.event.workflow_run.head_commit.message, '[skip ci]') == false &&
      github.event.workflow_run.head_commit.author.username != 'dependabot[bot]')
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Validate package workflow run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid package workflow run ID." >&2
            exit 1
          fi
          WORKFLOW_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cli-package-build.yml" --jq '.id')"
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" \
            --argjson workflow_id "$WORKFLOW_ID" --argjson run_id "$RUN_ID" '
              .id == $run_id and .workflow_id == $workflow_id and
              .path == ".github/workflows/cli-package-build.yml" and
              .repository.full_name == $repo and .head_repository.full_name == $repo and
              .head_branch == $branch and .status == "completed" and .conclusion == "success" and
              (.event == "workflow_run" or .event == "workflow_dispatch") and
              (.head_sha | test("^[0-9a-f]{40}$"))
            ' <<< "$RUN_JSON" >/dev/null; then
            echo "Package artifacts must come from a successful trusted CLI Package Build run." >&2
            exit 1
          fi
          {
            echo "run_id=$RUN_ID"
            echo "head_sha=$(jq -r '.head_sha' <<< "$RUN_JSON")"
            echo "event=$(jq -r '.event' <<< "$RUN_JSON")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Download validated CLI packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pastebox-cli-packages
          path: ${{ runner.temp }}/pastebox-cli-packages
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag from package artifact
        id: tag
        env:
          RUN_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          RUN_EVENT: ${{ steps.source.outputs.event }}
        shell: bash
        run: |
          git fetch --tags --force
          PACKAGE_DIR="$RUNNER_TEMP/pastebox-cli-packages"
          TAG="$(tr -d '\r\n' < "$PACKAGE_DIR/release-tag.txt")"

          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag in package artifact: $TAG" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          # Legacy artifacts can only be tied to the workflow's source commit.
          SOURCE_COMMIT="$RUN_HEAD_SHA"
          if [ -f "$PACKAGE_DIR/release-commit.txt" ]; then
            SOURCE_COMMIT="$(cat "$PACKAGE_DIR/release-commit.txt")"
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$SOURCE_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Package source does not match the release tag; rebuild packages." >&2
            exit 1
          fi
          if [ "$RUN_EVENT" = "workflow_run" ] && [ "$SOURCE_COMMIT" != "$RUN_HEAD_SHA" ]; then
            echo "Automatic package source does not match its workflow commit." >&2
            exit 1
          fi
          git checkout --detach "$TAG_COMMIT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREVIOUS_TAG="$(git tag --sort=-v:refname | awk -v current="$TAG" '/^v/ && $0 != current { print; exit }')"

          {
            echo "## CLI Packages"
            echo
            echo "- Debian / Ubuntu: .deb"
            echo "- Arch Linux: .pkg.tar.zst"
            echo "- RHEL family (x86_64): .rpm"
            echo "- Void Linux (x86_64 / aarch64, glibc / musl): .xbps"
            echo "- [CLI installation and usage](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/package.md)"
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              git log "$TAG" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
          } > release-notes.md

      - name: Create immutable GitHub Release with CLI packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PACKAGE_DIR="$RUNNER_TEMP/pastebox-cli-packages"

          # Older manually selected artifacts may predate a package format.
          shopt -s nullglob
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            MISSING=0
            for FILE in "$PACKAGE_DIR"/*.deb "$PACKAGE_DIR"/*.pkg.tar.zst "$PACKAGE_DIR"/*.rpm "$PACKAGE_DIR"/*.xbps "$PACKAGE_DIR/checksums.txt"; do
              NAME="$(basename "$FILE")"
              if ! grep -Fxq "$NAME" <<< "$RELEASE_ASSETS"; then
                echo "Immutable release $TAG is missing asset: $NAME" >&2
                MISSING=1
              fi
            done
            if [ "$MISSING" -ne 0 ]; then
              echo "Create a new release tag; published immutable releases cannot accept additional assets." >&2
              exit 1
            fi
            echo "Release $TAG already contains every CLI package asset."
            exit 0
          fi

          gh release create "$TAG" \
            "$PACKAGE_DIR"/*.deb \
            "$PACKAGE_DIR"/*.pkg.tar.zst \
            "$PACKAGE_DIR"/*.rpm \
            "$PACKAGE_DIR"/*.xbps \
            "$PACKAGE_DIR/checksums.txt" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pastebox-cli-release-metadata
          path: ${{ runner.temp }}/pastebox-cli-packages/release-tag.txt
          if-no-files-found: error
          retention-days: 7
